[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homograph-guard"
dynamic = ["version"]
description = "IDN homograph phishing checker for URLs, domains and email addresses, with multi-resolver DNS comparison (Google, Cloudflare, AdGuard) and a sandboxed runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ameya343" }]
keywords = ["phishing", "homograph", "idn", "punycode", "dns", "security", "soc", "threat-intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
    "Environment :: Console",
    "Environment :: X11 Applications",
]
dependencies = [
    "dnspython>=2.6,<3",
    "idna>=3.7",
    "publicsuffixlist>=1.0",
]

[project.optional-dependencies]
tls = ["cryptography>=42"]
dev = ["pytest>=8.2","bandit>=1.7", "cryptography>=42", "ruff>=0.6"]

[project.scripts]
homograph-guard = "homograph_guard.cli:main"

[project.gui-scripts]
homograph-guard-gui = "homograph_guard.gui.app:main"

[project.urls]
Homepage = "https://github.com/Ameya343/homograph-guard"

[tool.setuptools.dynamic]
version = { attr = "homograph_guard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homograph_guard = ["data/*.txt", "gui/icons/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105", "SIM108", "SIM117", "SIM905"]
